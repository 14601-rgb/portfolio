from pathlib import Path
css = """@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;font-family:'Prompt',sans-serif}
html{scroll-behavior:smooth}
body{
background:linear-gradient(135deg,#ffe6f2,#fff7fb,#ffeef8);
background-size:400% 400%;
animation:bgmove 12s ease infinite;
color:#555;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

header{
position:sticky;top:0;z-index:1000;
display:flex;justify-content:space-between;align-items:center;
padding:18px 8%;
background:rgba(255,255,255,.7);
backdrop-filter:blur(12px);
box-shadow:0 6px 18px rgba(0,0,0,.08);
}
.logo{font-size:28px;font-weight:700;color:#ff4fa0}
nav a{text-decoration:none;color:#666;margin-left:18px;font-weight:500;transition:.3s}
nav a:hover{color:#ff4fa0}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:120px 20px}
.hero img{width:220px;height:220px;border-radius:50%;object-fit:cover;border:8px solid #fff;box-shadow:0 15px 30px rgba(255,105,180,.3);transition:.3s}
.hero img:hover{transform:scale(1.05) rotate(3deg)}
.hero h1{font-size:46px;color:#ff4fa0;margin:20px 0 10px}
.hero p{max-width:700px;line-height:1.8}
.button,.btn,.card a{
display:inline-block;padding:14px 30px;margin-top:20px;
border-radius:50px;text-decoration:none;color:#fff;
background:linear-gradient(135deg,#ff8ec7,#ff69b4);
box-shadow:0 8px 20px rgba(255,105,180,.35);
transition:.35s;
}
.button:hover,.btn:hover,.card a:hover{transform:translateY(-5px);box-shadow:0 15px 30px rgba(255,105,180,.45)}
.container{max-width:1100px;margin:50px auto;padding:20px}
.card{
background:rgba(255,255,255,.75);
backdrop-filter:blur(12px);
border-radius:24px;
padding:25px;
margin:20px 0;
box-shadow:0 10px 25px rgba(0,0,0,.08);
transition:.3s;
}
.card:hover{transform:translateY(-6px)}
.card h2{color:#ff4fa0;margin-bottom:10px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.gallery img{width:100%;border-radius:18px;transition:.3s}
.gallery img:hover{transform:scale(1.04)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}
th,td{padding:14px;border-bottom:1px solid #eee}
th{background:#ffd8ea}
footer{text-align:center;padding:25px;color:#777}
@media(max-width:768px){
header{flex-direction:column}
nav{margin-top:10px}
nav a{display:inline-block;margin:6px}
.hero h1{font-size:34px}
}
"""
out=Path("/mnt/data/style.css")
out.write_text(css,encoding="utf-8")
print(out)
